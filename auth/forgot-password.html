<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - KuanZGame.Store</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/authenticator-forgot-password.css">

</head>
<body>
    <div class="container">
        <h2>🔑 Quên Mật Khẩu</h2>
        <p class="subtitle">Nhập email của bạn để nhận hướng dẫn<br>đặt lại mật khẩu</p>
        <div id="message" class="message"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="email" placeholder="Nhập email của bạn" required>
            </div>
            <button type="submit" class="btn-primary">📨 Gửi Email</button>
        </form>

        <button onclick="window.location.href='login'" class="btn-secondary">← Quay lại đăng nhập</button>

        <div class="links">
            <a onclick="window.location.href='signup'">Chưa có tài khoản? Đăng ký</a>
        </div>
    </div>

    <script src="../assets/js/firebase.js"></script>
<script src="../assets/js/authenticator-forgot-password.js"></script>
</body>
</html>
