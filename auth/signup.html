<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - KuanZGame.Store</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/authenticator-signup.css">

</head>
<body>
    <div class="container">
        <h2>📝 Đăng Ký</h2>
        <p class="subtitle">Tạo tài khoản mới</p>
        <div id="message" class="message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label>👤 Users</label>
                <input type="text" id="fullName" placeholder="Chỉ chữ cái và số, không ký tự đặc biệt" required>
                <div class="input-status idle" id="usernameStatus">
                    <span class="icon">ℹ️</span>
                    <span>Chỉ chấp nhận chữ cái (a-z, A-Z) và số (0-9)</span>
                </div>
            </div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="email" placeholder="Nhập email của bạn" required>
                <div class="input-status idle" id="emailStatus">
                    <span class="icon">ℹ️</span>
                    <span>Nhập email để kiểm tra</span>
                </div>
            </div>
            <div class="form-group">
                <label>🔑 Mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
                    <button type="button" class="toggle-password" id="togglePassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar">
                        <div class="strength-bar-fill" id="strengthBarFill"></div>
                    </div>
                    <div class="strength-text">
                        <span class="label">🔐 Độ mạnh mật khẩu:</span>
                        <span class="value" id="strengthValue">--</span>
                    </div>
                </div>
                <div class="password-hint">* Mật khẩu phải có ít nhất 6 ký tự</div>
            </div>

            <div class="terms-section">
                <label class="terms-checkbox">
                    <input type="checkbox" id="termsCheckbox">
                    <span class="terms-text">
                        Tôi đồng ý với 
                        <span class="link" onclick="event.preventDefault(); window.location.href='../assets/html/terms-of-service'">Điều khoản</span>
                        và 
                        <span class="link-policy" onclick="event.preventDefault(); window.location.href='../assets/html/privacy-policy'">Chính sách</span>
                        của chúng tôi
                    </span>
                </label>
                <div class="terms-error" id="termsError">⚠️ Vui lòng đồng ý với Điều khoản và Chính sách để tiếp tục!</div>
            </div>

            <button type="submit" class="btn-primary" id="signupBtn">🚀 Đăng Ký</button>
        </form>

        <div class="links">
            <a onclick="window.location.href='login'">← Quay lại đăng nhập</a>
        </div>
    </div>

    <script src="../assets/js/firebase.js"></script>
<script src="../assets/js/authenticator-signup.js"></script>
</body>
</html>
