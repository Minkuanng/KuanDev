<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch sử mua hàng - KuanZGame.Store</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/pages-history.css">

</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">⏳ Đang tải lịch sử...</div>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <span style="font-weight:700;color:var(--text-primary);"><i class="fas fa-bars"></i> Menu</span>
            <span class="close" onclick="closeMenu()"><i class="fas fa-times"></i></span>
        </div>
        <button class="menu-item" onclick="goHome()"><span class="icon"><i class="fas fa-home"></i></span>Trang chủ</button>
        <button class="menu-item" onclick="goHistory()"><span class="icon"><i class="fas fa-history"></i></span>Lịch sử</button>
        <button class="menu-item" onclick="goTopup()"><span class="icon"><i class="fas fa-coins"></i></span>Nạp tiền</button>
        <button class="menu-item" onclick="goEarn()"><span class="icon"><i class="fas fa-money-bill-wave"></i></span>Kiếm tiền</button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="goSupport()"><span class="icon"><i class="fas fa-headset"></i></span>Hỗ trợ</button>
    </div>

    <header class="header">
        <div class="header-left">
            <div class="menu-icon" onclick="toggleMenu()">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <div class="logo"></div>
        </div>
        <div class="header-right">
            <div class="wallet-container">
                <div class="wallet-icon-box"><i class="fas fa-wallet"></i></div>
                <div class="wallet-info">
                    <span class="wallet-label">Số dư</span>
                    <span class="wallet-balance"><span id="balanceAmount">0</span> <span>VND</span></span>
                </div>
            </div>
            <div class="bell-icon" onclick="toggleNotif()">
                <div class="bell-dot" id="notifDot"></div>
                <i class="fas fa-bell"></i>
            </div>
            <div class="settings-wrapper">
                <div class="dot-menu" onclick="togglePopup(event)">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <div class="popup" id="settingsPopup">
                    <button class="popup-item" onclick="goToProfile()"><i class="fas fa-user"></i> Trang cá nhân</button>
                    <button class="popup-item" onclick="goToSecurity()"><i class="fas fa-shield-alt"></i> Bảo mật tài khoản</button>
                    <button class="popup-item" onclick="goToBalance()"><i class="fas fa-coins"></i> Biến động số dư</button>
                    <button class="popup-item" onclick="goToSettings()"><i class="fas fa-cog"></i> Cài đặt giao diện</button>
                    <div class="popup-divider"></div>
                    <button class="popup-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
                </div>
            </div>
        </div>
    </header>

    <div class="notif-popup" id="notifPopup">
        <div class="notif-header"><span><i class="fas fa-bullhorn"></i> Thông báo</span><span class="close" onclick="toggleNotif()"><i class="fas fa-times"></i></span></div>
        <div id="notifList"><div class="empty"><i class="far fa-bell-slash"></i> Chưa có thông báo</div></div>
    </div>

    <div class="content">
        <div class="history-card">
            <h1><i class="fas fa-history"></i> Lịch sử mua hàng</h1>
            <p class="sub">Xem lại các đơn hàng đã mua</p>

            <div class="stats-row">
                <div class="stat-box"><div class="num" id="totalOrders">0</div><div class="label"><i class="fas fa-box"></i> Tổng đơn</div></div>
                <div class="stat-box"><div class="num" id="totalSpent">0</div><div class="label"><i class="fas fa-coins"></i> Tổng chi</div></div>
            </div>

            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="🔍 Tìm theo tên sản phẩm hoặc mã đơn..." oninput="filterOrders()">
                <select id="sortSelect" onchange="filterOrders()">
                    <option value="newest">🕐 Mới nhất</option>
                    <option value="oldest">🕐 Cũ nhất</option>
                    <option value="high">💰 Giá cao → thấp</option>
                    <option value="low">💰 Giá thấp → cao</option>
                </select>
                <button class="btn-clear" onclick="clearFilter()"><i class="fas fa-undo"></i> Xóa lọc</button>
            </div>

            <div class="delete-bar">
                <button class="btn-delete danger" onclick="deleteSelectedOrders()" id="deleteSelectedBtn" disabled>
                    <i class="fas fa-trash"></i> Xóa đã chọn
                </button>
                <button class="btn-delete outline" onclick="toggleSelectAll()" id="selectAllBtn">
                    <i class="fas fa-check-double"></i> Chọn tất cả
                </button>
                <button class="btn-delete danger" onclick="deleteAllOrders()" style="background:var(--danger);color:#fff;">
                    <i class="fas fa-trash-alt"></i> Xóa tất cả
                </button>
            </div>

            <div class="order-list" id="orderList">
                <div class="empty-state">
                    <span class="big-icon">📦</span>
                    <p>Chưa có đơn hàng nào</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <h3><i class="fas fa-receipt"></i> Chi tiết đơn hàng</h3>
            <div id="detailContent"></div>
            <button class="close-modal" onclick="closeDetailModal()"><i class="fas fa-times"></i> Đóng</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../assets/js/firebase.js"></script>
<script src="../assets/js/pages-history.js"></script>
</body>
</html>
