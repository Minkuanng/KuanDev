<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Số dư - KuanZGame.Store</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/users-balance.css">

</head>
<body>

    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="menu-header"><span style="font-weight:700;color:var(--text-primary);"><i class="fas fa-bars"></i> Menu</span><span class="close" onclick="closeMenu()"><i class="fas fa-times"></i></span></div>
        <button class="menu-item" onclick="goHome()"><span class="icon"><i class="fas fa-home"></i></span>Trang chủ</button>
        <button class="menu-item" onclick="goHistory()"><span class="icon"><i class="fas fa-history"></i></span>Lịch sử</button>
        <button class="menu-item" onclick="goTopup()"><span class="icon"><i class="fas fa-coins"></i></span>Nạp tiền</button>
        <button class="menu-item" onclick="goEarn()"><span class="icon"><i class="fas fa-money-bill-wave"></i></span>Kiếm tiền</button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="goSupport()"><span class="icon"><i class="fas fa-headset"></i></span>Hỗ trợ</button>
    </div>

    <header class="header">
        <div class="header-left">
            <div class="menu-icon" onclick="toggleMenu()">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <div class="logo"></div>
        </div>
        <div class="header-right">
            <div class="wallet-container">
                <div class="wallet-icon-box"><i class="fas fa-wallet"></i></div>
                <div class="wallet-info">
                    <span class="wallet-label">Số dư</span>
                    <span class="wallet-balance"><span id="balanceAmount">0</span> <span>VND</span></span>
                </div>
            </div>
            <div class="bell-icon" onclick="toggleNotif()"><div class="bell-dot" id="notifDot"></div><i class="fas fa-bell"></i></div>
            <div class="settings-wrapper">
                <div class="dot-menu" onclick="togglePopup(event)">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <div class="popup" id="settingsPopup">
                    <button class="popup-item" onclick="goToProfile()"><i class="fas fa-user"></i> Trang cá nhân</button>
                    <button class="popup-item" onclick="goToSecurity()"><i class="fas fa-shield-alt"></i> Bảo mật tài khoản</button>
                    <button class="popup-item" onclick="goToBalance()"><i class="fas fa-coins"></i> Biến động số dư</button>
                    <button class="popup-item" onclick="goToSettings()"><i class="fas fa-cog"></i> Cài đặt giao diện</button>
                    <div class="popup-divider"></div>
                    <button class="popup-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
                </div>
            </div>
        </div>
    </header>

    <div class="notif-popup" id="notifPopup">
        <div class="notif-header"><span><i class="fas fa-bullhorn"></i> Thông báo</span><span class="close" onclick="toggleNotif()"><i class="fas fa-times"></i></span></div>
        <div id="notifList"><div class="empty"><i class="far fa-bell-slash"></i> Chưa có thông báo</div></div>
    </div>

    <div class="content">
        <div class="balance-card">
            <!-- Header -->
            <div class="balance-header">
                <div class="icon-circle"><i class="fas fa-coins"></i></div>
                <div class="info">
                    <h1>Số dư của tôi</h1>
                    <div class="sub">Quản lý số dư và lịch sử giao dịch</div>
                </div>
            </div>

            <!-- Balance Display -->
            <div class="balance-display">
                <div class="label"><i class="fas fa-wallet"></i> Số dư hiện tại</div>
                <div class="amount" id="currentBalance">0 <span class="currency">VND</span></div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <span class="icon" style="color:var(--success);"><i class="fas fa-arrow-down"></i></span>
                    <div class="number" id="totalIncome">0đ</div>
                    <div class="label">Đã nhận</div>
                </div>
                <div class="stat-box">
                    <span class="icon" style="color:var(--danger);"><i class="fas fa-arrow-up"></i></span>
                    <div class="number" id="totalExpense">0đ</div>
                    <div class="label">Đã dùng</div>
                </div>
                <div class="stat-box">
                    <span class="icon" style="color:var(--accent);"><i class="fas fa-list-ul"></i></span>
                    <div class="number" id="totalTransactions">0</div>
                    <div class="label">Giao dịch</div>
                </div>
            </div>

            <!-- Filter -->
            <div class="filter-section">
                <div class="title"><i class="fas fa-clock-rotate-left"></i> Lịch sử giao dịch</div>
                <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
                    <div class="filter-group">
                        <button class="filter-btn active" data-filter="all" onclick="filterTransactions('all')">Tất cả</button>
                        <button class="filter-btn" data-filter="income" onclick="filterTransactions('income')">Nhận</button>
                        <button class="filter-btn" data-filter="expense" onclick="filterTransactions('expense')">Dùng</button>
                    </div>
                    <button class="btn-refresh" onclick="refreshData()"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>

            <!-- Transaction List -->
            <div class="transaction-list" id="transactionList">
                <div class="empty-state">
                    <span class="icon">📭</span>
                    <span class="text">Chưa có giao dịch nào</span>
                </div>
            </div>

            <!-- Back Button -->
            <button class="btn-back" onclick="goToSettings()"><i class="fas fa-arrow-left"></i> Quay lại cài đặt</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../assets/js/firebase.js"></script>
<script src="../assets/js/users-balance.js"></script>
</body>
</html>
