<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin - KuanZGame.Store</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/users-profile.css">

</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">⏳ Đang tải dữ liệu...</div>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="menu-header"><span style="font-weight:700;color:var(--text-primary);"><i class="fas fa-bars"></i> Menu</span><span class="close" onclick="closeMenu()"><i class="fas fa-times"></i></span></div>
        <button class="menu-item" onclick="goHome()"><span class="icon"><i class="fas fa-home"></i></span>Trang chủ</button>
        <button class="menu-item" onclick="goHistory()"><span class="icon"><i class="fas fa-history"></i></span>Lịch sử</button>
        <button class="menu-item" onclick="goTopup()"><span class="icon"><i class="fas fa-coins"></i></span>Nạp tiền</button>
        <button class="menu-item" onclick="goEarn()"><span class="icon"><i class="fas fa-money-bill-wave"></i></span>Kiếm tiền</button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="goSupport()"><span class="icon"><i class="fas fa-headset"></i></span>Hỗ trợ</button>
    </div>

    <header class="header">
        <div class="header-left">
            <div class="menu-icon" onclick="toggleMenu()">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <div class="logo"></div>
        </div>
        <div class="header-right">
            <div class="wallet-container">
                <div class="wallet-icon-box"><i class="fas fa-wallet"></i></div>
                <div class="wallet-info">
                    <span class="wallet-label">Số dư</span>
                    <span class="wallet-balance"><span id="balanceAmount">0</span> <span>VND</span></span>
                </div>
            </div>
            <div class="bell-icon" onclick="toggleNotif()"><div class="bell-dot" id="notifDot"></div><i class="fas fa-bell"></i></div>
            <div class="settings-wrapper">
                <div class="dot-menu" onclick="togglePopup(event)">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <div class="popup" id="settingsPopup">
                    <button class="popup-item" onclick="goToProfile()"><i class="fas fa-user"></i> Trang cá nhân</button>
                    <button class="popup-item" onclick="goToSecurity()"><i class="fas fa-shield-alt"></i> Bảo mật tài khoản</button>
                    <button class="popup-item" onclick="goToBalance()"><i class="fas fa-coins"></i> Biến động số dư</button>
                    <button class="popup-item" onclick="goToSettings()"><i class="fas fa-cog"></i> Cài đặt giao diện</button>
                    <div class="popup-divider"></div>
                    <button class="popup-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
                </div>
            </div>
        </div>
    </header>

    <div class="notif-popup" id="notifPopup">
        <div class="notif-header"><span><i class="fas fa-bullhorn"></i> Thông báo</span><span class="close" onclick="toggleNotif()"><i class="fas fa-times"></i></span></div>
        <div id="notifList"><div class="empty"><i class="far fa-bell-slash"></i> Chưa có thông báo</div></div>
    </div>

    <div class="content">
        <div class="profile-card">
            <!-- Avatar -->
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <div class="avatar" id="avatar">👤</div>
                    <div class="avatar-status" id="userStatus"></div>
                </div>
                <div class="profile-name" id="userName">Người dùng</div>
                <div class="profile-email" id="userEmail">email@example.com</div>
                <div id="adminBadgeContainer"></div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <span class="icon" style="color:var(--accent);"><i class="fas fa-calendar-plus"></i></span>
                    <div class="number" id="memberDays">0</div>
                    <div class="label">Ngày tham gia</div>
                </div>
                <div class="stat-box">
                    <span class="icon" style="color:var(--success);"><i class="fas fa-check-circle"></i></span>
                    <div class="number" id="totalOrders">0</div>
                    <div class="label">Đơn hàng</div>
                </div>
                <div class="stat-box">
                    <span class="icon" style="color:var(--warning);"><i class="fas fa-coins"></i></span>
                    <div class="number" id="totalSpent">0đ</div>
                    <div class="label">Đã chi</div>
                </div>
            </div>

            <!-- Balance -->
            <div class="balance-box">
                <div class="left">
                    <div class="icon-circle"><i class="fas fa-coins"></i></div>
                    <div>
                        <div class="blabel"><i class="fas fa-wallet"></i> Số dư</div>
                        <div class="bamount" id="profileBalance">0 VND</div>
                    </div>
                </div>
                <div class="right">
                    <button class="btn-refresh" onclick="refreshBalance()"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>

            <!-- Info List -->
            <div class="info-list">
                <div class="info-item">
                    <div class="icon-box"><i class="fas fa-envelope"></i></div>
                    <div class="info-content">
                        <div class="label">Email</div>
                        <div class="value" id="displayEmail">---</div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="icon-box"><i class="fas fa-user"></i></div>
                    <div class="info-content">
                        <div class="label">Tên người dùng</div>
                        <div class="value" id="displayName">---</div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="icon-box"><i class="fas fa-id-card"></i></div>
                    <div class="info-content">
                        <div class="label">UID</div>
                        <div class="value mono" id="displayUid">---</div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="icon-box"><i class="fas fa-calendar-plus"></i></div>
                    <div class="info-content">
                        <div class="label">Ngày tạo</div>
                        <div class="value" id="displayCreated">---</div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="icon-box"><i class="fas fa-clock"></i></div>
                    <div class="info-content">
                        <div class="label">Lần đăng nhập cuối</div>
                        <div class="value" id="displayLastLogin">---</div>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <button class="btn btn-security" onclick="goToSecurity()"><i class="fas fa-shield-alt"></i> Bảo mật</button>
                <button class="btn btn-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Quay lại</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../assets/js/firebase.js"></script>
<script src="../assets/js/users-profile.js"></script>
</body>
</html>
